[buildout]
extends =
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/test-6.2.x.cfg
    base.cfg

[versions]
# zc.buildout 6 (Plone 6.2.3) fails with "No module named 'plone.recipe'"
